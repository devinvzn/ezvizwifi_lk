<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | EzvizWifi</title>
<style>
:root{--blue:#1a6bff;--ink:#222;--mute:#666;--bg:#f5f8ff;--card:#fff;--line:#e6e9f0}
@media (prefers-color-scheme:dark){:root{--ink:#f1f1f1;--mute:#aab;--bg:#14171c;--card:#1d2128;--line:#2c313a}}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:26px;color:var(--ink);letter-spacing:-.5px}
.logo b{color:var(--blue)}
nav a{margin-left:22px;text-decoration:none;color:var(--ink);font-size:16px}
nav a:hover,nav a.on{color:var(--blue)}
.hero{text-align:center;padding:50px 20px 20px}
.hero h1{margin:0 0 10px;font-size:36px}
.hero p{margin:0;color:var(--mute)}
.grid{max-width:1200px;margin:30px auto 60px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.img{height:200px;background:linear-gradient(135deg,#dbe8ff,#eef4ff);display:flex;align-items:center;justify-content:center}
.img img{max-width:100%;max-height:100%;object-fit:contain}
.body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:18px}
.body p{margin:0;color:var(--mute);font-size:14px;line-height:1.5;flex:1}
.price{font-size:20px;font-weight:700;color:var(--blue)}
.btn{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;padding:11px;border-radius:999px;font-weight:600;margin-top:6px}
.btn:hover{opacity:.9}
footer{background:var(--card);border-top:1px solid var(--line);text-align:center;padding:36px 20px}
footer p{margin:6px 0;color:var(--mute);font-size:15px}
@media(max-width:560px){nav a{margin:0 12px 0 0}.hero h1{font-size:28px}}
</style>
</head>
<body id="top">
<header><div class="bar">
  <a class="logo" href="index.html" aria-label="EzvizWifi home">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1a6bff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.3" fill="#1a6bff" stroke="none"/></svg>
    <span><b>Ezviz</b>Wifi</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html" class="on">Products</a>
    <a href="index.html#about">About Us</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</div></header>

<section class="hero">
  <h1>Our Products</h1>
  <p>EZVIZ Wi-Fi cameras with company warranty and installation.</p>
</section>

<main class="grid" id="grid"></main>

<footer>
  <p>&#128205; 75 A Mirihana Rd, Nugegoda 10250</p>
  <p>&copy; 2026 EzvizWifi. All rights reserved.</p>
</footer>

<script>
// ===== EDIT HERE =====
// WhatsApp number in international format, no + or spaces (Sri Lanka: 94 then number without the first 0)
var WHATSAPP = "94XXXXXXXXX";

// Add or change products here. image: put a file name like "c6n.jpg" in the same folder, or leave "" for no photo.
var PRODUCTS = [
  { name: "EZVIZ C6N",        desc: "Indoor pan & tilt Wi-Fi camera.",      price: "Rs. XX,XXX", image: "" },
  { name: "EZVIZ C8C",        desc: "Outdoor pan & tilt Wi-Fi camera.",     price: "Rs. XX,XXX", image: "" },
  { name: "EZVIZ CB8 Lite",   desc: "4K battery-powered Wi-Fi camera.",     price: "Rs. XX,XXX", image: "" }
];
// =====================

var grid = document.getElementById("grid");
PRODUCTS.forEach(function (p) {
  var msg = encodeURIComponent("Hi, I'm interested in the " + p.name);
  var img = p.image
    ? '<img src="' + p.image + '" alt="' + p.name + '">'
    : '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1a6bff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.2" fill="#1a6bff" stroke="none"/></svg>';
  var el = document.createElement("div");
  el.className = "card";
  el.innerHTML =
    '<div class="img">' + img + '</div>' +
    '<div class="body"><h3>' + p.name + '</h3><p>' + p.desc + '</p>' +
    '<div class="price">' + p.price + '</div>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + WHATSAPP + '?text=' + msg + '">Order on WhatsApp</a></div>';
  grid.appendChild(el);
});
</script>
</body>
</html>
